<div class="auth-layout">

  <div class="toast toast-success" *ngIf="successMessage()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10" />
      <path d="M8 12l3 3 5-6" />
    </svg>
    <span>{{ successMessage() }}</span>
  </div>

  <aside class="brand-panel">
    <div class="brand-content">
      <svg class="cup-icon" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M20 40 h50 v25 a25 25 0 0 1-25 25 h0 a25 25 0 0 1-25-25 Z" fill="none" stroke="currentColor"
          stroke-width="3" />
        <path d="M70 45 h8 a10 10 0 0 1 0 20 h-8" fill="none" stroke="currentColor" stroke-width="3" />
        <path class="steam s1" d="M35 32 Q38 24 35 18" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" />
        <path class="steam s2" d="M48 32 Q51 22 48 14" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" />
        <path class="steam s3" d="M61 32 Q64 24 61 18" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" />
      </svg>
      <h1 class="brand-name">CafeLoyalty</h1>
      <p class="brand-tagline">Join the club. Earn points on every order and unlock rewards as you sip.</p>
    </div>
  </aside>

  <main class="form-panel">
    <div class="form-wrap">
      <h2 class="form-heading">Create account</h2>
      <p class="form-subheading">Sign up and start earning from your first cup.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="field">
          <span class="field-label">Name</span>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </svg>
            <input type="text" formControlName="name" placeholder="Jane Doe" autocomplete="name" />
          </div>
          <span class="field-error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
            Enter your name.
          </span>
        </label>

        <label class="field">
          <span class="field-label">Email</span>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6l9 7 9-7M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" />
            </svg>
            <input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <span class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Enter a valid email address.
          </span>
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••"
              autocomplete="new-password" />
            <button type="button" class="toggle-visibility" (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
            Password must be at least 6 characters.
          </span>
        </label>

        <label class="field">
          <span class="field-label">Confirm password</span>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirmPassword"
              placeholder="••••••••" autocomplete="new-password" />
            <button type="button" class="toggle-visibility" (click)="toggleConfirmPassword()"
              [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showConfirmPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg *ngIf="showConfirmPassword()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="form.get('confirmPassword')?.touched && form.errors?.['passwordMismatch']">
            Passwords do not match.
          </span>
        </label>

        <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

        <button type="submit" class="btn-primary" [disabled]="loading() || successMessage()">
          {{ loading() ? 'Creating account…' : 'Create account' }}
        </button>
      </form>

      <p class="switch-auth">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </main>
</div>
